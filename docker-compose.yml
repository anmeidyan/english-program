name: englishpath

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: englishpath-app:dev
  volumes:
    - ./:/var/www/html
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *app

  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-englishpath}
      MYSQL_USER: ${DB_USERNAME:-englishpath}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine

  horizon:
    <<: *app
    command: php artisan horizon

  scheduler:
    <<: *app
    command: php artisan schedule:work

  node:
    image: node:22-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app
    ports:
      - "${VITE_PORT:-5173}:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  mailpit:
    image: axllent/mailpit
    ports:
      - "${FORWARD_MAILPIT_PORT:-8025}:8025"

  minio:
    image: minio/minio
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minio12345}
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  minio_data:
